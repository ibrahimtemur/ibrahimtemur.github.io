<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#163138"/>
      <stop offset="100%" stop-color="#0E1B20"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3CCFC0" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#F2A65A" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0" y1="16" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#56DDD0"/>
      <stop offset="55%" stop-color="#3CCFC0"/>
      <stop offset="100%" stop-color="#0E8F86"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="36" y1="16" x2="28" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7C286"/>
      <stop offset="50%" stop-color="#F2A65A"/>
      <stop offset="100%" stop-color="#C9731E"/>
    </linearGradient>
  </defs>

  <!-- Squircle Backdrop -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="url(#rimGrad)" stroke-width="1.5"/>

  <!-- Subtle Orbital Wireframe Ring + Particles matching Hero 3D Emblem -->
  <ellipse cx="32" cy="32" rx="25" ry="12.5" transform="rotate(-16 32 32)" stroke="#23444D" stroke-width="1.2"/>
  <circle cx="13" cy="18" r="1.4" fill="#3CCFC0" opacity="0.85"/>
  <circle cx="51" cy="46" r="1.3" fill="#F2A65A" opacity="0.85"/>
  <circle cx="49" cy="16" r="1.1" fill="#3CCFC0" opacity="0.7"/>

  <!-- Left Beveled Chevron '<' -->
  <polygon points="8.5,32 19,20.5 22.4,23.6 14.3,32 22.4,40.4 19,43.5" fill="url(#bracketGrad)" stroke="#7EECE0" stroke-width="0.75" stroke-linejoin="round"/>
  <!-- Depth shadow facet on '<' -->
  <polyline points="8.5,32 19,43.5 22.4,40.4" stroke="#0B6D67" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Center Beveled Slash '/' -->
  <polygon points="34.2,17.2 38.8,17.2 29.8,46.8 25.2,46.8" fill="url(#slashGrad)" stroke="#FAD6AD" stroke-width="0.75" stroke-linejoin="round"/>
  <line x1="38.8" y1="17.2" x2="29.8" y2="46.8" stroke="#A85D16" stroke-width="1.1"/>

  <!-- Right Beveled Chevron '>' -->
  <polygon points="55.5,32 45,20.5 41.6,23.6 49.7,32 41.6,40.4 45,43.5" fill="url(#bracketGrad)" stroke="#7EECE0" stroke-width="0.75" stroke-linejoin="round"/>
  <polyline points="55.5,32 45,43.5 41.6,40.4" stroke="#0B6D67" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
